
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-50">

    <!-- Header -->
    <header class="bg-purple-700 text-white p-5 shadow-lg">
        <h1 class="text-3xl font-bold">🛍️ MyStore</h1>
        <p class="text-purple-200 mt-1">Your favourite shopping destination</p>
    </header>

    <!-- Products -->
    <div class="p-6">
        <h2 class="text-3xl font-bold text-center text-purple-900 mb-2">
            Our Products
        </h2>

        <p class="text-center text-gray-600 mb-6">
            Discover the best products at amazing prices!
        </p>

        <div class="flex flex-wrap justify-center gap-6">

            <!-- Product 1 -->
            <div class="bg-white p-4 w-60 rounded-xl shadow-md hover:shadow-xl hover:-translate-y-1 transition">
                <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80"
                     alt="Laptop"
                     class="w-full h-36 object-cover rounded-lg">

                <h3 class="text-xl font-bold text-purple-900 mt-3">Laptop</h3>
                <p class="text-gray-600 mt-1">Price: ₹1,00,000</p>

                <button class="bg-purple-700 hover:bg-purple-900 text-white w-full p-2 mt-3 rounded-lg">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white p-4 w-60 rounded-xl shadow-md hover:shadow-xl hover:-translate-y-1 transition">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80"
                     alt="Mobile"
                     class="w-full h-36 object-cover rounded-lg">

                <h3 class="text-xl font-bold text-purple-900 mt-3">Mobile</h3>
                <p class="text-gray-600 mt-1">Price: ₹70,999</p>

                <button class="bg-purple-700 hover:bg-purple-900 text-white w-full p-2 mt-3 rounded-lg">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white p-4 w-60 rounded-xl shadow-md hover:shadow-xl hover:-translate-y-1 transition">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
                     alt="Shoes"
                     class="w-full h-36 object-cover rounded-lg">

                <h3 class="text-xl font-bold text-purple-900 mt-3">Shoes</h3>
                <p class="text-gray-600 mt-1">Price: ₹5,000</p>

                <button class="bg-purple-700 hover:bg-purple-900 text-white w-full p-2 mt-3 rounded-lg">
                    Buy Now
                </button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white p-4 w-60 rounded-xl shadow-md hover:shadow-xl hover:-translate-y-1 transition">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                     alt="Watch"
                     class="w-full h-36 object-cover rounded-lg">

                <h3 class="text-xl font-bold text-purple-900 mt-3">Watch</h3>
                <p class="text-gray-600 mt-1">Price: ₹3,499</p>

                <button class="bg-purple-700 hover:bg-purple-900 text-white w-full p-2 mt-3 rounded-lg">
                    Buy Now
                </button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-purple-950 text-white text-center p-5 mt-6">
        <p>MyStore © 2026 | All Rights Reserved</p>
    </footer>

</body>
</html>
